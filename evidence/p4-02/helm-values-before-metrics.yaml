affinity: {}
certs:
  ca:
    crt: ""
  client:
    crt: ""
    key: ""
  existingClientSecret: ""
  existingSecret: ""
  server:
    crt: ""
    key: ""
collectors:
  containerEngine:
    enabled: true
    engines:
      bpm:
        enabled: true
      containerd:
        enabled: true
        sockets:
        - /run/host-containerd/containerd.sock
      cri:
        enabled: true
        sockets:
        - /run/containerd/containerd.sock
        - /run/crio/crio.sock
        - /run/k3s/containerd/containerd.sock
        - /run/host-containerd/containerd.sock
      docker:
        enabled: true
        sockets:
        - /var/run/docker.sock
      libvirt_lxc:
        enabled: true
      lxc:
        enabled: true
      podman:
        enabled: true
        sockets:
        - /run/podman/podman.sock
    hooks:
    - create
    labelMaxLen: 100
    pluginRef: ghcr.io/falcosecurity/plugins/plugin/container:0.7.1
    withSize: false
  enabled: true
  kubernetes:
    collectorHostname: ""
    collectorPort: ""
    enabled: false
    hostProc: /host
    pluginRef: ghcr.io/falcosecurity/plugins/plugin/k8smeta:0.4.1
    verbosity: info
containerSecurityContext: {}
controller:
  annotations: {}
  daemonset:
    updateStrategy:
      type: RollingUpdate
  deployment:
    replicas: 1
  kind: daemonset
  labels: {}
customRules:
  det-004-package-manager.yaml: |-
    - rule: Package Manager Executed in Container
      desc: Detect package manager execution inside a running container
      condition: "evt.type = execve and evt.dir = < and container and proc.name in (apt, apt-get, dpkg, yum, dnf, rpm, apk)"
      output: "Package manager executed in container (user=%user.name command=%proc.cmdline container_id=%container.id container_name=%container.name image=%container.image.repository:%container.image.tag k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)"
      priority: WARNING
      tags: [container, package_management, det-004]
  det-005-script-interpreter.yaml: |-
    - rule: Script Interpreter Executed in Container
      desc: Detect script interpreter execution inside a running container
      condition: "evt.type = execve and container and proc.name in (python, python3, perl, ruby, node, php)"
      output: "Script interpreter executed in container (user=%user.name command=%proc.cmdline parent=%proc.pname container_id=%container.id container_name=%container.name image=%container.image.repository:%container.image.tag k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)"
      priority: WARNING
      tags: [container, execution, script_interpreter, det-005]
  det-006-service-account-token.yaml: |-
    - rule: Kubernetes Service Account Token Read
      desc: Detect reads of Kubernetes service account token files from a container
      condition: "evt.type in (open, openat, openat2) and evt.is_open_read = true and container and fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount/ and fd.name endswith /token"
      output: "Kubernetes service account token read (user=%user.name process=%proc.name command=%proc.cmdline file=%fd.name container_id=%container.id container_name=%container.name image=%container.image.repository:%container.image.tag k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)"
      priority: WARNING
      tags: [container, credential_access, kubernetes, det-006]
  det-007-mounted-secret.yaml: |-
    - rule: Mounted Application Secret Read
      desc: Detect reads of application secrets mounted inside a container
      condition: "evt.type in (open, openat, openat2) and evt.is_open_read = true and container and fd.name startswith /etc/app-secrets/"
      output: "Mounted application secret read (user=%user.name process=%proc.name command=%proc.cmdline file=%fd.name container_id=%container.id container_name=%container.name image=%container.image.repository:%container.image.tag k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)"
      priority: WARNING
      tags: [container, credential_access, secret, det-007]
  det-008-privilege-change.yaml: |-
    - rule: Setuid or Setgid Executed in Container
      desc: Detect setuid or setgid system calls used to change identity inside a container
      condition: >
        evt.type in (setuid, setgid, setreuid, setregid, setresuid, setresgid) and
        container
      output: >
        Privilege identity change in container
        (user=%user.name process=%proc.name command=%proc.cmdline
        container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, privilege_escalation, det-008]
  det-009-suspicious-namespace.yaml: |-
    - rule: Suspicious Namespace Operation in Container
      desc: Detect namespace manipulation using setns or unshare inside a container
      condition: >
        evt.type in (setns, unshare) and
        container
      output: >
        Suspicious namespace operation in container
        (user=%user.name process=%proc.name command=%proc.cmdline
        container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, privilege_escalation, namespace, det-009]
  det-010-runtime-socket.yaml: |-
    - rule: Container Runtime Socket Access
      desc: Detect access to container runtime sockets from inside a container
      condition: >
        evt.type in (open, openat, openat2, connect) and
        container and
        fd.name in (
          /run/containerd/containerd.sock,
          /var/run/containerd/containerd.sock,
          /var/run/docker.sock,
          /run/crio/crio.sock,
          /var/run/crio/crio.sock
        )
      output: >
        Container runtime socket accessed
        (user=%user.name process=%proc.name command=%proc.cmdline
        file=%fd.name container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, container_runtime, privilege_escalation, det-010]
  det-011-host-filesystem.yaml: |-
    - rule: Host Proc or Sys Access from Container
      desc: Detect access to host proc or sys filesystem mounted inside a container
      condition: >
        evt.type in (open, openat, openat2) and
        evt.is_open_read = true and
        container and
        (fd.name startswith /host/proc/ or
        fd.name startswith /host/sys/) and
        not k8s.ns.name = longhorn-system
      output: >
        Host filesystem accessed from container
        (user=%user.name process=%proc.name command=%proc.cmdline
        file=%fd.name container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, host_access, discovery, det-011]
  det-012-kubectl-in-container.yaml: |-
    - rule: Kubectl Executed in Container
      desc: Detect kubectl execution inside a running container
      condition: >
        evt.type = execve and
        container and
        proc.name = kubectl
      output: >
        Kubectl executed in container
        (user=%user.name process=%proc.name command=%proc.cmdline
        container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, kubernetes, discovery, det-012]
  det-014-cron-persistence.yaml: |-
    - rule: Cron Persistence File Created in Container
      desc: Detect creation or modification of cron persistence files inside a container
      condition: >
        evt.type in (open, openat, openat2) and
        evt.is_open_write = true and
        container and
        (fd.name startswith /etc/cron.d/ or
         fd.name = /etc/crontab)
      output: >
        Cron persistence file modified
        (user=%user.name process=%proc.name command=%proc.cmdline
        file=%fd.name container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, persistence, cron, det-014]
  det-015-executable-modification.yaml: |-
    - rule: Executable File Created or Modified in Container
      desc: Detect creation or modification of executable files in system binary directories inside a container
      condition: >
        evt.type in (open, openat, openat2) and
        evt.is_open_write = true and
        container and
        (fd.name startswith /usr/bin/ or
         fd.name startswith /usr/local/bin/ or
         fd.name startswith /bin/)
      output: >
        Executable file created or modified in container
        (user=%user.name process=%proc.name command=%proc.cmdline
        file=%fd.name container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: WARNING
      tags: [container, persistence, executable, det-015]
  det-016-discovery-tools.yaml: |-
    - rule: Discovery Tool Executed in Container
      desc: Detect process or network discovery tools executed inside a container
      condition: >
        evt.type = execve and
        container and
        proc.name in (ps, ss, netstat, ifconfig, ip)
      output: >
        Discovery tool executed in container
        (user=%user.name process=%proc.name command=%proc.cmdline
        container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: NOTICE
      tags: [container, discovery, det-016]
  det-017-outbound-connection.yaml: |-
    - rule: Outbound Connection from Container
      desc: Detect outbound TCP connections from non-system workloads
      condition: >
        evt.type = connect and
        container and
        fd.type = ipv4 and
        fd.l4proto = tcp and
        not (k8s.ns.name in (falco, kube-system, longhorn-system))
      output: >
        Outbound connection from container
        (user=%user.name process=%proc.name command=%proc.cmdline
        connection=%fd.name remote_port=%fd.rport
        container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: NOTICE
      tags: [container, network, outbound, det-017]
  det-018-reverse-shell.yaml: |-
    - rule: Reverse Shell Network Connection
      desc: Detect bash TCP socket usage that can indicate a reverse shell
      condition: >
        evt.type = connect and
        container and
        proc.name = bash and
        proc.cmdline contains "/dev/tcp/"
      output: >
        Reverse shell network connection detected
        (user=%user.name process=%proc.name command=%proc.cmdline
        connection=%fd.name remote_port=%fd.rport
        container_id=%container.id container_name=%container.name
        image=%container.image.repository:%container.image.tag
        k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
      priority: ERROR
      tags: [container, network, reverse_shell, det-018]
driver:
  enabled: true
  kind: auto
  kmod:
    bufSizePreset: 4
    dropFailedExit: false
  loader:
    enabled: true
    initContainer:
      args: []
      env: []
      image:
        pullPolicy: IfNotPresent
        registry: docker.io
        repository: falcosecurity/falco-driver-loader
        tag: ""
      resources: {}
      securityContext: {}
  modernEbpf:
    bufSizePreset: 4
    cpusForEachBuffer: 2
    disableIterators: false
    dropFailedExit: false
    leastPrivileged: false
    sysfsMount: true
  sysfsMountPath: /sys/kernel
extra:
  args: []
  env: []
  initContainers: []
falco:
  append_output:
  - suggested_output: true
  base_syscalls:
    all: false
    custom_set: []
    repair: false
  buffer_format_base64: false
  buffered_outputs: false
  capture:
    default_duration: 5000
    enabled: false
    mode: rules
    path_prefix: /tmp/falco
  config_files:
  - /etc/falco/config.d
  falco_libs:
    snaplen: 80
    thread_table_auto_purging_interval_s: 300
    thread_table_auto_purging_thread_timeout_s: 300
    thread_table_size: 262144
  file_output:
    enabled: false
    filename: ./events.txt
    keep_alive: false
  http_output:
    ca_bundle: ""
    ca_cert: ""
    ca_path: /etc/falco/certs/
    client_cert: /etc/falco/certs/client/client.crt
    client_key: /etc/falco/certs/client/client.key
    compress_uploads: false
    echo: false
    enabled: false
    insecure: false
    keep_alive: false
    max_consecutive_timeouts: 5
    mtls: false
    url: ""
    user_agent: falcosecurity/falco
  json_include_message_property: false
  json_include_output_fields_property: true
  json_include_output_property: true
  json_include_tags_property: true
  json_output: false
  libs_logger:
    enabled: true
    severity: info
  load_plugins: []
  log_level: info
  log_stderr: true
  log_syslog: true
  output_timeout: 2000
  outputs_queue:
    capacity: 0
  plugins: []
  plugins_hostinfo: true
  priority: debug
  program_output:
    enabled: false
    keep_alive: false
    program: 'jq ''{text: .output}'' | curl -d @- -X POST https://hooks.slack.com/services/XXX'
  rule_matching: first
  rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/rules.d
  stdout_output:
    enabled: true
  syscall_event_drops:
    actions:
    - log
    - alert
    max_burst: 1
    rate: 0.03333
    simulate_drops: false
    threshold: 0.1
  syscall_event_timeouts:
    max_consecutives: 1000
  syslog_output:
    enabled: true
  time_format_iso_8601: false
  watch_config_files: true
  webserver:
    enabled: true
    k8s_healthz_endpoint: /healthz
    listen_address: 0.0.0.0
    listen_port: 8765
    prometheus_metrics_enabled: false
    ssl_certificate: /etc/falco/falco.pem
    ssl_enabled: false
    threadiness: 0
falco-talon: {}
falcoHostnameEnv: true
falcoctl:
  artifact:
    follow:
      args:
      - --log-format=json
      enabled: true
      env: []
      envFrom: []
      mounts:
        volumeMounts: []
      resources: {}
      securityContext: {}
    install:
      args:
      - --log-format=json
      enabled: true
      env: []
      envFrom: []
      mounts:
        volumeMounts: []
      resources: {}
      securityContext: {}
  config:
    artifact:
      allowedTypes:
      - rulesfile
      - plugin
      follow:
        every: 168h
        falcoversions: http://localhost:8765/versions
        pluginsDir: /plugins
        refs:
        - falco-rules:5
        rulesfilesDir: /rulesfiles
        stateDir: /artifactstate
      install:
        pluginsDir: /plugins
        refs:
        - falco-rules:5
        resolveDeps: true
        rulesfilesDir: /rulesfiles
        stateDir: /artifactstate
    indexes:
    - name: falcosecurity
      url: https://falcosecurity.github.io/falcoctl/index.yaml
  image:
    pullPolicy: IfNotPresent
    registry: docker.io
    repository: falcosecurity/falcoctl
    tag: 0.13.0
falcosidekick:
  enabled: true
  fullfqdn: false
  listenPort: ""
  webui:
    enabled: true
fullnameOverride: ""
grafana:
  dashboards:
    configMaps:
      falco:
        folder: ""
        folderAnnotation: grafana_dashboard_folder
        name: falco-grafana-dashboard
        namespace: ""
    enabled: false
healthChecks:
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 15
    timeoutSeconds: 5
  startupProbe:
    failureThreshold: 20
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 5
image:
  pullPolicy: IfNotPresent
  registry: docker.io
  repository: falcosecurity/falco
  tag: ""
imagePullSecrets: []
metrics:
  convertMemoryToMB: true
  enabled: false
  includeEmptyValues: false
  interval: 1h
  jemallocStatsEnabled: false
  kernelEventCountersEnabled: true
  kernelEventCountersPerCPUEnabled: false
  kernelIterEventCountersEnabled: true
  libbpfStatsEnabled: true
  outputRule: false
  pluginsMetricsEnabled: true
  resourceUtilizationEnabled: true
  rulesCountersEnabled: true
  service:
    annotations: {}
    create: true
    labels: {}
    ports:
      metrics:
        ipFamilies: []
        ipFamilyPolicy: ""
        port: 8765
        protocol: TCP
        targetPort: 8765
    type: ClusterIP
  stateCountersEnabled: true
mounts:
  volumeMounts: []
  volumes: []
nameOverride: ""
namespaceOverride: ""
nodeSelector: {}
podAnnotations: {}
podHostname: null
podLabels: {}
podPriorityClassName: null
podSecurityContext: {}
rbac:
  create: true
resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 512Mi
responseActions:
  enabled: false
scc:
  create: true
serviceAccount:
  annotations: {}
  create: true
  imagePullSecrets: []
  name: ""
serviceMonitor:
  create: false
  endpointPort: metrics
  interval: 15s
  labels: {}
  path: /metrics
  relabelings: []
  scheme: http
  scrapeTimeout: 10s
  selector: {}
  targetLabels: []
  tlsConfig: {}
services: null
tolerations:
- effect: NoSchedule
  key: node-role.kubernetes.io/master
- effect: NoSchedule
  key: node-role.kubernetes.io/control-plane
tty: false
