- rule: Setuid or Setgid Executed in Container
  desc: Detect setuid or setgid system calls used to change identity inside a container
  condition: >
    evt.type in (setuid, setgid, setreuid, setregid, setresuid, setresgid) and
    container
  output: >
    Privilege identity change in container
    (user=%user.name process=%proc.name command=%proc.cmdline
    container_id=%container.id container_name=%container.name
    image=%container.image.repository:%container.image.tag
    k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  tags: [container, privilege_escalation, det-008]
