- rule: Kubernetes Service Account Token Read
  desc: Detect reads of Kubernetes service account token files from a container
  condition: >
    evt.type in (open, openat, openat2) and
    evt.is_open_read = true and
    container and
    fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount/ and
    fd.name endswith /token
  output: >
    Kubernetes service account token read
    (user=%user.name process=%proc.name command=%proc.cmdline
    file=%fd.name container_id=%container.id container_name=%container.name
    image=%container.image.repository:%container.image.tag
    k8s_ns=%k8s.ns.name k8s_pod=%k8s.pod.name)
  priority: WARNING
  tags: [container, credential_access, kubernetes, det-006]
