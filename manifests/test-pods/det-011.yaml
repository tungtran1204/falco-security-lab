apiVersion: v1
kind: Pod
metadata:
  name: det-011-test
spec:
  restartPolicy: Never
  containers:
    - name: det-011-test
      image: ubuntu:22.04
      command: ["sleep", "3600"]
      volumeMounts:
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
  volumes:
    - name: host-proc
      hostPath:
        path: /proc
        type: Directory
