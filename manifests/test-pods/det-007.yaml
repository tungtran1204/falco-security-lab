apiVersion: v1
kind: Secret
metadata:
  name: det-007-secret
type: Opaque
stringData:
  password: falco-test-secret
---
apiVersion: v1
kind: Pod
metadata:
  name: det-007-test
spec:
  restartPolicy: Never
  containers:
    - name: det-007-test
      image: ubuntu:22.04
      command: ["sleep", "3600"]
      volumeMounts:
        - name: app-secret
          mountPath: /etc/app-secrets
          readOnly: true
  volumes:
    - name: app-secret
      secret:
        secretName: det-007-secret
